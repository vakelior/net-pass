name: net-pass

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: install
        run: |
          sudo apt update -y
          sudo apt install -y openssh-server

      - name: print public info
        run: |
          echo "PUBLIC_IP=$(curl -s https://api.ipify.org)"
          echo "Run the connection command on your device:"
          echo "  ssh -p 2222 -D 1080 -N runner@$(curl -s https://api.ipify.org)"

      - name: setup ssh server
        run: |
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBKEY }}" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd -p 2222 -o PermitRootLogin=no -o PasswordAuthentication=no

      - name: keep alive
        run: |
          for i in $(seq 1 350); do
            echo "alive $i"
            sleep 60
          done
