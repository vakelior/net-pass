name: net-pass

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: install proxy
        run: |
          sudo apt update -y
          sudo apt install -y microsocks curl

      - name: show connection info
        run: |
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "=========================================="
          echo "SOCKS5 CONNECTION INFO"
          echo "=========================================="
          echo "Host     : $PUBLIC_IP"
          echo "Port     : 1080"
          echo "Type     : SOCKS5"
          echo "(no username / no password)"
          echo "=========================================="

      - name: run socks5 proxy
        run: |
          microsocks -i 0.0.0.0 -p 1080 > /tmp/microsocks.log 2>&1 &
          echo "socks5 proxy started on port 1080 (no auth)"
          for i in $(seq 1 350); do sleep 60; done
